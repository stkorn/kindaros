name: ci

on:
  push:
  pull_request:

jobs:
  receipt-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: kinda-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - name: Start stack
        run: make up
      - name: Static, unit and offline checks
        run: make check
      - name: Receipt smoke through Kafka, Spark and PostgreSQL
        run: make smoke
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI stack
        if: always()
        run: docker compose down -v
